<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width" />
		<title>Alexander Bolotskov</title>
		<link rel="stylesheet" href="style.css" />
		<script>
			const theme = localStorage.theme ?? (window.matchMedia("(prefers-color-scheme: dark)").matches ? 'dark' : 'light')
			document.documentElement.dataset.theme = theme
			function toggleTheme() {
				const currentTheme = localStorage.theme ?? (window.matchMedia("(prefers-color-scheme: dark)").matches ? 'dark' : 'light')
				document.documentElement.dataset.theme = localStorage.theme = currentTheme === 'dark' ? 'light' : 'dark'
			}
		</script>
	</head>
	<body class="bg-color dark:text-zinc-100 text-zinc-900 flex flex-col min-h-screen">
		<header class="header">
			<menu class="lowercase flex gap-8">
				<li><a href="/">Front Page</a></li>
				<li><a href="/posts">Blog</a></li>
				<li><a href="/tools">Tools</a></li>
				<li><button class="lowercase" onclick="toggleTheme()">Toggle theme</button></li>
			</menu>
		</header>
		<section class="section topograph">
			<div class="container">
				<h1 class="text-6xl mb-4 font-display">Alexander Bolotskov</h1>
				<p>Front-end dev who really likes his job</p>
			</div>
		</section>
		<footer class="footer">
			<div class="container py-4 ">
				<p><span id="year">2026</span> &copy; Carefully crafted using <a target="_blank" href="https://11ty.dev">11ty</a></p>
			</div>
		</footer>
		<script>
			document.addEventListener('DOMContentLoaded', () => {
				document.getElementById('year').textContent = new Date().getFullYear();
			})
		</script>
	</body>
</html>
