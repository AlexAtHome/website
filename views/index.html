<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width" />
		<title>Alexander Bolotskov</title>
		<link rel="stylesheet" href="style.css" />
		<script>
			const theme = localStorage.theme ?? (window.matchMedia("(prefers-color-scheme: dark)").matches ? 'dark' : 'light')
			document.documentElement.dataset.theme = theme
			function toggleTheme() {
				const currentTheme = localStorage.theme ?? (window.matchMedia("(prefers-color-scheme: dark)").matches ? 'dark' : 'light')
				document.documentElement.dataset.theme = localStorage.theme = currentTheme === 'dark' ? 'light' : 'dark'
			}
		</script>
	</head>
	<body class="bg-color dark:text-zinc-100 text-zinc-900 flex flex-col min-h-screen">
		<header class="header justify-between">
			<menu class="lowercase flex gap-8">
				<li><a href="/">Front Page</a></li>
				<li><a href="/posts">Blog</a></li>
				<li><a href="/tools">Tools</a></li>
			</menu>
			<menu class="lowercase flex gap-8">
				<li><button class="lowercase" onclick="toggleTheme()">Toggle theme</button></li>
			</menu>
		</header>
		<section class="section topograph">
			<div class="container">
				<h1 class="text-[6.7dvw] md:text-4xl mb-4 font-display text-purple-700">Alexander Bolotskov</h1>
				<p class="lowercase">i code things</p>
			</div>
		</section>
		<section class="section topograph">
			<div class="container p-0">
				<div class="grid sm:grid-cols-2 lg:grid-cols-3">
					<img class="inline-grid lg:aspect-square w-full" src="https://github.com/AlexAtHome.png" alt="" />
					<div class="inline-grid content-start p-8">
						<p>I have been in the web development for over 10 years now.</p>
					</div>
					<div class="inline-grid sm:grid-cols-2 md:grid-cols-1 topograph aspect-video sm:aspect-auto lg:aspect-square h-full w-full"></div>
				</div>
			</div>
		</section>
		<footer class="footer">
			<div class="container py-4">
				<p><span id="year">2026</span> &copy; Carefully crafted using <a target="_blank" href="https://11ty.dev">11ty</a></p>
			</div>
		</footer>
		<script>
			document.addEventListener('DOMContentLoaded', () => {
				document.getElementById('year').textContent = new Date().getFullYear();
			})
		</script>
	</body>
</html>
